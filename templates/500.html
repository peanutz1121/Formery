{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Formery Timesheet Database</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Jost:wght@300;400;500;600&amp;display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="public">
  <div class="public-wrap"><div class="public-shell">
    <a class="brand brand-public" href="/">{% include "partials/_brand.html" %}</a>
    <section class="card error-card">
      <p class="error-code serif">500</p>
      <h2 class="serif">Something went wrong on our side</h2>
      <p class="muted">The error has been recorded. Please try again in a moment. Your saved timesheets have not been affected.</p>
      <a class="btn btn-primary" href="/">Back to the start</a>
    </section>
  </div></div>
</body>
</html>
